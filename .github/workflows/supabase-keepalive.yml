# Ping Supabase tiap hari supaya project gratis tidak di-pause (7 hari tanpa aktivitas).
# Kalau ping gagal (misalnya project sudah ter-pause), workflow merah dan GitHub mengirim email ke pemilik repo.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 1 * * *" # tiap hari sekitar 08.17 WIB
  workflow_dispatch:

permissions:
  contents: read
  actions: write # untuk menyalakan ulang jadwal ini (GitHub mematikan jadwal di repo yang 60 hari tanpa commit)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets/js/config.js
          sparse-checkout-cone-mode: false

      - name: Ping database
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" assets/js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" assets/js/config.js)
          RES=$(curl -fsS --retry 3 --retry-delay 20 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Jawaban: $RES"
          test "$RES" = "true"

      - name: Jaga jadwal tetap aktif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/enable"
